name: Mark and Close Stale Issues

on:
  schedule:
  - cron: 0 */12 * * * # Every 12 hours
permissions:
  actions: write
  contents: write # only for delete-branch option
  issues: write
  pull-requests: write

jobs:
  staleIssues:
    # Only run this on repositories in the 'spinnaker' org, not on forks.
    if: startsWith(github.repository, 'spinnaker/')
    runs-on: ubuntu-latest
    steps:
    - name: Setup PMG proxy
      id: pmg-setup
      uses: safedep/pmg@v1
      with:
        server-mode: true
        api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
        tenant-id: ${{ secrets.PMG_TENANT_ID }}
    - name: stale
      uses: actions/stale@v10
      with:
        exempt-issue-labels: 'beginner friendly,no-lifecycle'
        days-before-issue-stale: 45
        days-before-issue-close: 45
        stale-issue-label: 'to-be-closed'
        operations-per-run: 50
        stale-issue-message: >
          This issue hasn't been updated in 45 days so we are tagging it as 'to-be-closed'.
          It will be closed in 45 days. Add some activity and the label will be removed within several hours.
        close-issue-message: >
          This issue is tagged as 'to-be-closed' and hasn't been updated in 90 days, so we are closing it.
          You can always reopen this issue if needed.
    - name: Enforce PMG policy
      if: always()
      run: |
        if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
          pmg proxy stop --fail-on-violation
        else
          pmg proxy stop || true
        fi
