name: Kork
run-name: Kork ${{ github.ref_name }} (${{ github.event_name }})

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
      - release-*
    paths:
      - 'kork/**'
      - '.github/workflows/kork.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - uses: ./.github/actions/generic-build-publish
        with:
          project: kork
          publish: false
          integration-test: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
