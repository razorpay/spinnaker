name: Kayenta Integration Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - release-*
    paths:
      - 'kayenta/**'
      - '.github/workflows/kayenta-integration-tests.yml'

  pull_request:
    paths:
      - 'kayenta/**'
      - '.github/workflows/kayenta-integration-tests.yml'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g -Xms2g

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        tests:
          ['Management', 'Swagger']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: Gradle validation step
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'gradle'

      - name: Run Integration Test
        run: |
          ./gradlew :kayenta:kayenta-integration-tests:test --tests ${{ matrix.tests }}Test

      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi

  provider-integration-tests:
    name: Provider Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        provider: ['Prometheus', 'Graphite']
        test: ['canaryAnalysisIsSuccessful', 'canaryAnalysisIsFailed']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PMG proxy
        id: pmg-setup
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: Gradle validation step
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
          cache: 'gradle'

      - name: Run Provider Integration Test
        run: |
          ./gradlew :kayenta:kayenta-integration-tests:test --tests ${{ matrix.provider }}StandaloneCanaryAnalysisTest.${{ matrix.test }}

      - name: Enforce PMG policy
        if: always()
        run: |
          if [ "${{ steps.pmg-setup.outcome }}" = "success" ]; then
            pmg proxy stop --fail-on-violation
          else
            pmg proxy stop || true
          fi
