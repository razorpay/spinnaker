service: spinnaker  # required, canonical slug — immutable once registered
displayName: "Spinnaker (Razorpay Fork)"  # required, human-readable name — qualified deliberately: this row is razorpay/spinnaker, the vendored fork of the upstream Spinnaker monorepo, not the Spinnaker product in the abstract and not Razorpay's own deployment tooling (that is razorpay/spinnaker-sleeve and razorpay/spinacode, catalogued separately)
description: "Razorpay's vendored fork of the upstream Spinnaker monorepo (github.com/spinnaker/spinnaker) — the source of the continuous-delivery platform Razorpay runs its deployment pipelines on, carrying all of Spinnaker's services (clouddriver, orca, gate, deck, echo, front50, igor, rosco, fiat, kayenta, keel, kork, halyard, spin CLI) so the install can be built, patched and security-scanned in-house."  # required, one-sentence description of what the service does — the README.adoc is upstream's, so grounded in the GitHub API: fork: true with parent spinnaker/spinnaker, default branch main holding the upstream monorepo top level (clouddriver/, orca/, gate/, deck/, echo/, front50/, igor/, rosco/, fiat/, kayenta/, keel/, kork/, halyard/, spin/, spinnaker-kustomize/, MONOREPO.md), and a compare against upstream showing 0 commits ahead / 72 behind. The install it feeds is the one alerted on by rules/prod/infrastructure/k8s/spinnaker/spinnaker-alerts.yaml (per-deployment vajra_links for halyard, spin-clouddriver-ro, spin-clouddriver-rw, spin-deck, spin-echo) and visible in the local Netra inventory as the spinnaker namespace on cde-green and prod-white
type: service  # required, one of: service | worker | cron | library | pipeline — the artefacts built from this tree are the Spinnaker HTTP services that run in the spinnaker Kubernetes namespace on cde-green and prod-white (spin-deck, spin-gate, spin-clouddriver-ro/rw, spin-echo and the halyard deployment, all named in the alert-rules vajra_links), so the row describes a deployed service rather than shared code. Recorded despite the tree itself being upstream source: there is no Dockerfile-per-service Razorpay owns here — images come from the upstream release/halyard path
tier: T2  # required, one of: T0 | T1 | T2 | T3 · Payments Reliability sheet Priority P2 → T2, kept as the sheet has it, and matching the already-patched spinnaker-sleeve. Flagging the same tension: the Spinnaker install this fork feeds is the deployment path for the whole org, so an outage blocks every prod deploy including incident hotfixes — which argues for T1. Kept at T2 because it carries no customer traffic and, more importantly for this row, the fork itself is inert: it is 0 commits ahead of upstream, so nothing is currently built from Razorpay-specific code here
lifecycle: live  # optional, one of: incubating | live | deprecated | retired (default: live)

domain: tech-infra/devops  # required, two-level domain/subgroup slug — the Payments Reliability sheet has no BU for this repo and it carries no .github/repo_owners.json or CODEOWNERS, so derived from where the artefact is operated: its alert rules live under rules/prod/infrastructure/k8s/spinnaker/ in razorpay/alert-rules (the DevOps-owned infrastructure tree), its channel is #tech_spinnaker, and area tech-infra/devops is what the already-patched spinnaker-sleeve — the same function, the same channel — uses. tech-infra/infra-productivity (Saruman) is the arguable alternative if the POD files Spinnaker operations under Infra Productivity

owner:
  team:  # required, owning team slug — TO FILL: this repo has no CODEOWNERS file, .github/repo_owners.json carries no team slug, and the GitHub repository-teams API is not readable with the current token; ask the POD lead for the owning GitHub team
  pm:  # product manager — TO FILL: no DevRev runnable and no PM anywhere; a vendored upstream fork of a CD platform has no product owner. Ask the DevOps POD lead (the group that owns rules/prod/infrastructure/k8s/spinnaker in alert-rules) to confirm this stays empty and to record the owning GitHub team, which is also missing

links:
  repo: "https://github.com/razorpay/spinnaker"  # canonical GitHub repo URL
  alerts_repo: "https://github.com/razorpay/alert-rules/blob/master/rules/prod/infrastructure/k8s/spinnaker/spinnaker-alerts.yaml"  # this service's alert rules in razorpay/alert-rules
  slos:  # SLO definitions — TO FILL: no slo.yaml at this repo root and no sloth ruleset for it under razorpay/alert-rules/slo/prod (the two places SLOs are defined today); add one there and link it here
  slack_channel: "#tech_spinnaker"  # primary Slack channel for this service — 556 members, purpose "Channel to collate all conversions/improvements/standardization regarding Spinnaker pipelines", and the channel the already-patched spinnaker-sleeve manifest uses. Of the draft's other candidates, #spinnaker-mcp-server-releases (6) belongs to the separate spinnaker-mcp-server service, #coralogix-unified-mcp-spinnaker-deployments (3) is a deployment feed, and #test-spinnaker-slack (11) and #test_spinnaker (0) are test channels
  zenduty_policy:  # Zenduty policy/service name used for paging — TO FILL: the service-to-policy mapping is not in DevRev or alert-rules for this service; it lives in the external Zenduty policies sheet
  oncall_handle:  # Slack/PagerDuty oncall handle or usergroup — TO FILL: not set on the DevRev runnable
  runbook:  # link to the incident runbook — TO FILL: no runbook directory for this service in razorpay/rzp-oncall-agent; add one or link the Google Doc / alpha.razorpay.com page
  api_docs:  # API documentation — TO FILL, and the prefilled value should be dropped: the prefill picked keel/keel-web/src/test/kotlin/com/netflix/spinnaker/keel/apidocs/ApiDocTests.kt, which is an upstream Kotlin test class, not documentation. Spinnaker's API reference is published upstream at spinnaker.io/docs/reference/api and each service exposes its own Swagger under /swagger-ui; link the Razorpay Gate endpoint's Swagger (deploy-in.razorpay.com) if an internal reference is wanted
  dashboard:  # primary dashboard — TO FILL: Grafana (vajra) / Coralogix dashboard URL for this service (see per-region links below)
  logs_and_traces: "https://razorpay-prod.app.coralogix.in/#/query-new/archive-logs"  # org-standard prod Coralogix — filter subsystem "spinnaker"
  strategy_okr:  # TO FILL: link the FY strategy doc for the owning group.
  risk_assessment:  # TO FILL: no .agents/skills/risk-assessment in this repo; add the per-repo risk-assessment skill
  regions:  # per-region links; one block per geography this service is deployed in
    in:  # India · cells: mum-rspl (spinacode)
      dashboard: "https://vajra.razorpay.com/d/cba1cdd4-4557-4e94-a644-d7d35c140785/spinnaker-mcp?orgId=1&viewPanel=1"  # alert-rules vajra_link annotation
      deployment_pipeline_link: "https://deploy-in.razorpay.com/#/applications/prod-mum-rspl-spinnaker-mcp-server/executions"  # Spinnaker deployment pipeline for this region — no app named exactly prod-<cell>-spinnaker exists in spinacode; this is the closest of 1 — TO VERIFY which one is this repo's primary pipeline
      alerts_repo: "https://github.com/razorpay/alert-rules/blob/master/rules/prod/infrastructure/k8s/spinnaker/spinnaker-alerts.yaml"  # this region's ruleset for this service
    sg:  # Singapore
      dashboard:  # primary Grafana dashboard — TO FILL: no vajra_link annotation in this region's alert rules
      deployment_pipeline_link:  # Spinnaker deployment pipeline — TO FILL: no v3 pipeline for this region in spinacode
      alerts_repo: "https://github.com/razorpay/alert-rules/blob/master/rules/prod-sg-rules/infrastructure/k8s/spinnaker/spinnaker-alerts.yaml"  # this region's ruleset for this service

dependencies: []  # optional, declared service dependencies — TO FILL: shape: - service: <slug> for internal deps, - vendor: <name> for external (gateways, banks)


# Three corrections for whoever reads this row. (1) This is an unmodified vendored fork: GET repos/razorpay/spinnaker reports fork: true with parent spinnaker/spinnaker, and a compare of razorpay:main against spinnaker:main is 0 ahead / 72 behind, with every commit on main authored by upstream maintainers. The only Razorpay content is the branch security/add-pmg-workflows, which adds PMG/security jobs to the 28 upstream CI workflows and is unmerged. (2) The default branch is main, not master — the harvest recorded master, and the prefilled api_docs path uses /blob/master/. (3) The prefilled India pipeline link points at prod-mum-rspl-spinnaker-mcp-server, which is the separate spinnaker-mcp-server service (see #spinnaker-mcp-server-releases), not this repo; there is no Spinnaker application for the fork itself, because the install is managed through halyard. The vajra_link dashboards on the row (spinnaker-pod-availablity, spinnaker-mcp) do describe the running Spinnaker install and are the right thing to keep.
